<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eceef4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080a14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="劇目損益">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>舞台劇損益</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: 流動光暈背景 + 玻璃頂欄 + 彈簧指示器分段切換；總覽＝留意清單＋劇目卡；劇目＝Bento 便當格（損益算式／售票率圓環／成本結構／試算／花費明細／收入） */
:root{
  --bg:#eceef4; --ink:#10142a; --muted:#646b85; --line:rgba(16,20,42,.08);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.85); --glass-shadow:0 1px 1px rgba(16,20,42,.04),0 12px 32px -8px rgba(16,20,42,.14);
  --sunk:rgba(16,20,42,.045);
  --blob1:#f6c76b; --blob2:#62d6c8; --blob3:#ff9e8f; --blob4:#a7b7ff;
  --on:#10142a; --on-ink:#ffffff; --glow:rgba(255,255,255,.9);
  --good:#128556; --good-soft:rgba(18,133,86,.12); --bad:#d5362b; --bad-soft:rgba(213,54,43,.11); --warn:#a96a00; --warn-soft:rgba(169,106,0,.12);
  --c1:#e3a93a; --c2:#3f7df0; --c3:#16a59f; --c4:#e2587b; --c5:#8a63d6; --c6:#7685a6; --c7:#93ad2f;
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077 20.4%,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  /* 字級：全站只用這 7 級（為長輩閱讀，最小 13px） */
  --fs-xs:13px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:20px; --fs-2xl:26px; --fs-3xl:32px;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Manrope","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080a14; --ink:#eef0f8; --muted:#9aa2bf; --line:rgba(255,255,255,.08);
  --glass:rgba(24,28,50,.55); --glass-strong:rgba(28,32,56,.8); --glass-edge:rgba(255,255,255,.1); --glass-shadow:0 1px 1px rgba(0,0,0,.3),0 16px 40px -10px rgba(0,0,0,.6);
  --sunk:rgba(255,255,255,.05);
  --blob1:#7a5a1e; --blob2:#11635c; --blob3:#6e2c3a; --blob4:#2c3a8a;
  --on:#f1c766; --on-ink:#0b0d18; --glow:rgba(241,199,102,.25);
  --good:#52d39c; --good-soft:rgba(82,211,156,.14); --bad:#ff7b70; --bad-soft:rgba(255,123,112,.14); --warn:#f3c05a; --warn-soft:rgba(243,192,90,.14);
  --c1:#f1c766; --c2:#7aa2ff; --c3:#3fd0c8; --c4:#ff86a3; --c5:#b896f2; --c6:#9aa8c8; --c7:#c2d65c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080a14; --ink:#eef0f8; --muted:#9aa2bf; --line:rgba(255,255,255,.08);
  --glass:rgba(24,28,50,.55); --glass-strong:rgba(28,32,56,.8); --glass-edge:rgba(255,255,255,.1); --glass-shadow:0 1px 1px rgba(0,0,0,.3),0 16px 40px -10px rgba(0,0,0,.6);
  --sunk:rgba(255,255,255,.05);
  --blob1:#7a5a1e; --blob2:#11635c; --blob3:#6e2c3a; --blob4:#2c3a8a;
  --on:#f1c766; --on-ink:#0b0d18; --glow:rgba(241,199,102,.25);
  --good:#52d39c; --good-soft:rgba(82,211,156,.14); --bad:#ff7b70; --bad-soft:rgba(255,123,112,.14); --warn:#f3c05a; --warn-soft:rgba(243,192,90,.14);
  --c1:#f1c766; --c2:#7aa2ff; --c3:#3fd0c8; --c4:#ff86a3; --c5:#b896f2; --c6:#9aa8c8; --c7:#c2d65c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:10px}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.02em}
.cur{opacity:.9;font-weight:inherit;margin-right:.04em}
.pos{color:var(--good)} .neg{color:var(--bad)} .na{color:var(--muted)}
.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.hint{font-size:13px;color:var(--muted)}

/* ---------- 流動光暈背景 ---------- */
.mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(80px);opacity:.55}
.mesh i:nth-child(1){background:var(--blob1);top:-20vmax;left:-15vmax;animation:drift1 26s ease-in-out infinite alternate}
.mesh i:nth-child(2){background:var(--blob2);top:-10vmax;right:-20vmax;animation:drift2 30s ease-in-out infinite alternate}
.mesh i:nth-child(3){background:var(--blob3);bottom:-25vmax;left:10vmax;animation:drift3 34s ease-in-out infinite alternate;opacity:.4}
.mesh i:nth-child(4){background:var(--blob4);bottom:-20vmax;right:-10vmax;animation:drift1 28s ease-in-out infinite alternate-reverse;opacity:.45}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-10vmax,12vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(8vmax,-10vmax) scale(1.15)}}
.app{position:relative;z-index:1}

/* ---------- 玻璃元件 ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.tile{position:relative;border-radius:24px;padding:20px;overflow:hidden;isolation:isolate}
/* 跟隨游標的光暈 */
.lit::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 60%)}
.lit:hover::before{opacity:1}

/* ---------- 頂欄 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:10px}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:20px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#1a2350,#0e3346);color:#f1c766;display:grid;place-items:center;font-weight:900;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:12px;color:var(--muted)}
.ibtn{border:1px solid var(--line);background:var(--sunk);border-radius:12px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;transition:transform .5s var(--spring),background .2s;flex:none}
.ibtn:hover{background:var(--glass-strong)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:15px;height:15px}
.ibtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 分段切換＋彈簧指示器 */
.seg-wrap{margin-top:10px;overflow-x:auto;scrollbar-width:none;border-radius:16px}
.seg-wrap::-webkit-scrollbar{display:none}
.seg{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:16px;min-width:max-content}
.seg-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:12px;background:var(--on);box-shadow:0 4px 14px -4px rgba(16,20,42,.35);transition:transform .6s var(--spring),width .6s var(--spring);z-index:0}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;transition:color .25s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-current="true"]{color:var(--on-ink)}
.seg .dot{width:7px;height:7px;border-radius:50%}

/* ---------- 內容 ---------- */
main{padding-block:20px 80px}
.view{display:grid;gap:20px}
.sec{display:grid;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:4px}
h2{font-size:18px;font-weight:800;margin:0;letter-spacing:.01em}
.demo{border-radius:16px;padding:10px 14px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.r-low{background:var(--good-soft);color:var(--good)} .r-mid{background:var(--warn-soft);color:var(--warn)} .r-high{background:var(--bad-soft);color:var(--bad)}

/* 留意清單 */
.alerts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.alert{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:14px 16px;border-radius:18px;transition:transform .5s var(--spring)}
.alert:active{transform:scale(.97)}
.alert:focus-visible{outline:2px solid var(--ink)}
.a-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800}
.a-ic.bad{background:var(--bad-soft);color:var(--bad)} .a-ic.warn{background:var(--warn-soft);color:var(--warn)}
.a-t{font-size:14px;font-weight:700;line-height:1.35}
.a-s{font-size:12px;color:var(--muted)}
.ok{padding:14px 16px;border-radius:18px;color:var(--good);font-weight:600;font-size:14px}

/* 劇目卡 */
.plays{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.play{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:18px;padding:20px;border-radius:26px;transition:transform .6s var(--spring),box-shadow .3s}
.play:hover{transform:translateY(-4px)}
.play:active{transform:scale(.97)}
.play:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.p-no{font-size:11px;color:var(--muted);letter-spacing:.12em}
.p-name{font-size:22px;font-weight:900;line-height:1.25;text-wrap:balance;margin-top:2px}
.p-meta{font-size:12px;color:var(--muted);margin-top:2px}
.p-mid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.p-big{font-size:30px;font-weight:800;line-height:1.1}
.p-sub{font-size:12px;color:var(--muted);margin-top:4px}
.p-ring{position:relative;width:72px;height:72px;display:grid;place-items:center}
.p-ring svg{position:absolute;inset:0}
.p-ring b{font-size:14px;font-weight:800}
.p-ring small{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.p-bar{display:grid;gap:6px}
.p-bar-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.track{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--good);transform-origin:left}
.track .fill.over{background:var(--bad)}
.track .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.p-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.p-foot b{color:var(--ink)}
.go{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.go svg{transition:transform .5s var(--spring)}
.play:hover .go svg{transform:translateX(4px)}

/* ---------- Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.s2{grid-column:span 2} .s3{grid-column:span 3} .s4{grid-column:span 4} .s6{grid-column:span 6}
@media (max-width:860px){.s2,.s3,.s4{grid-column:span 3}.s6{grid-column:span 6}}
@media (max-width:620px){.bento{grid-template-columns:1fr}.s2,.s3,.s4,.s6{grid-column:auto}}
.d-head{display:grid;gap:18px}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-name{margin:2px 0 0;font-size:clamp(28px,5vw,40px);font-weight:900;line-height:1.15;text-wrap:balance}
.eq{display:grid;gap:8px}
.eq-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--sunk)}
.eq-op{font-size:20px;color:var(--muted);font-weight:300;text-align:center}
.eq-l{font-size:14px;font-weight:700}
.eq-s{font-size:12px;color:var(--muted)}
.eq-v{font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.2;text-align:right;white-space:nowrap}
.eq-r{background:var(--good-soft)} .eq-r.neg{background:var(--bad-soft)}
.eq-r .eq-v{font-size:clamp(24px,3.2vw,32px)}
.eq-r .eq-s,.eq-r .eq-op{color:inherit;opacity:.9}
.eq-r .eq-s{font-weight:700}

.ring-tile{display:grid;gap:10px;justify-items:center;align-content:center;text-align:center}
.ring{position:relative;width:150px;height:150px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;overflow:visible}
.ring-c b{display:block;font-size:30px;font-weight:800;line-height:1}
.ring-c span{font-size:11px;color:var(--muted)}
.ring-leg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.ring-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.arc{transition:stroke-dashoffset 1.2s var(--ease)}

.mix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.mix-d{position:relative;width:120px;height:120px;display:grid;place-items:center}
.mix-d svg{position:absolute;inset:0}
.mix-d b{font-size:13px;font-weight:800}
.leg{display:grid;gap:6px;font-size:13px}
.leg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center}
.leg i{width:10px;height:10px;border-radius:3px}
.leg span{min-width:0;line-height:1.35}
@media (max-width:520px){.mix{grid-template-columns:1fr;justify-items:center}.leg{width:100%}}

.scen{display:grid;gap:14px;align-content:center}
.scen-big{font-size:clamp(30px,4vw,40px);font-weight:800;line-height:1.1}
.scen input{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
.scen input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--on) var(--p,50%),var(--sunk) var(--p,50%))}
.scen input::-moz-range-track{height:8px;border-radius:4px;background:var(--sunk)}
.scen input::-moz-range-progress{height:8px;border-radius:4px;background:var(--on)}
.scen input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.scen input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.scen input:active::-webkit-slider-thumb{transform:scale(1.2)}
.scen-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

/* 花費明細 */
.cat{border-top:1px solid var(--line)}
.cat-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) repeat(3,minmax(90px,auto));gap:6px 14px;align-items:center;padding:14px 8px;border-radius:14px;transition:background .2s}
.cat-h:hover{background:var(--sunk)}
.cat-h:focus-visible{outline:2px solid var(--ink)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .5s var(--spring)}
.cat.open .chev{transform:rotate(90deg)}
.c-name{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700}
.c-name i{flex:none;width:10px;height:10px;border-radius:3px}
.c-name small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.c-num{text-align:right;font-size:14px;font-weight:700}
.c-num em{display:none;font-style:normal;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.c-bar{grid-column:2 / -1}
.cat-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.cat.open .cat-b{grid-template-rows:1fr}
.cat-b > div{overflow:hidden}
.items{padding:2px 8px 16px 44px;display:grid;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(90px,auto));gap:14px;padding:14px 16px;border-radius:14px;background:var(--sunk);font-size:16px;font-weight:700;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .4s var(--ease)}
.cat.open .item{opacity:1;transform:none}
.cat.open .item:nth-child(2){transition-delay:.04s} .cat.open .item:nth-child(3){transition-delay:.08s} .cat.open .item:nth-child(4){transition-delay:.12s} .cat.open .item:nth-child(n+5){transition-delay:.16s}
.item small{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:2px}
.item .c-num{font-size:19px;font-weight:700}
.none{font-size:13px;color:var(--muted);padding:6px 12px}
.mis{font-size:12px;color:var(--warn);padding:2px 12px}
.cols,.tot{display:grid;grid-template-columns:22px minmax(0,1fr) repeat(3,minmax(90px,auto));gap:14px;padding-inline:8px}
.cols{font-size:11px;font-weight:700;color:var(--muted);padding-block:6px 10px}
.cols span:nth-child(n+3){text-align:right}
.tot{padding-block:14px 0;border-top:1px solid var(--line);font-weight:800}
.tot .c-num{font-size:15px}
@media (max-width:620px){
  .cols{display:none}
  .cat-h,.tot{grid-template-columns:22px repeat(3,minmax(0,1fr))}
  .c-name{grid-column:2 / -1}
  .cat-h > :nth-child(3),.tot > :nth-child(3){grid-column:2}
  .cat-h > :nth-child(4),.tot > :nth-child(4){grid-column:3}
  .cat-h > :nth-child(5),.tot > :nth-child(5){grid-column:4}
  .c-num{text-align:left} .c-num em{display:block}
  .items{padding-left:8px}
  .item{grid-template-columns:repeat(3,minmax(0,1fr))}
  .item > :first-child{grid-column:1 / -1}
}
.inc-r{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(90px,auto));gap:14px;padding:12px 8px;border-top:1px solid var(--line);font-size:14px}
.inc-r > :not(:first-child){text-align:right}
.inc-r.h{font-size:11px;font-weight:700;color:var(--muted);border-top:0;padding-block:6px 10px}

/* ---------- 投資者分配 ---------- */

      <button class="ibtn" id="reload" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>更新</button>

<script>
const HK=new Intl.NumberFormat('zh-HK',{maximumFractionDigits:0});
const money=v=>(v==null||isNaN(v))?'—':`${v<0?'−':''}<span class="cur">$</span>${HK.format(Math.abs(Math.round(v)))}`;
const plain=v=>(v==null||isNaN(v))?'—':`${v<0?'−':''}$${HK.format(Math.abs(Math.round(v)))}`;
const signed=v=>(v==null||isNaN(v))?'—':`${v>0?'+':v<0?'−':''}<span class="cur">$</span>${HK.format(Math.abs(Math.round(v)))}`;
const pct=v=>(v==null||isNaN(v))?'—':(v*100).toFixed(1).replace(/\.0$/,'')+'%';
const tone=v=>v==null?'na':v>0?'pos':v<0?'neg':'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=l=>String(l).replace(/^\d\.\s*/,'');
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const ARROW='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let DATA=null, VIEW=-1;

/* ---------- 示範資料（只在未連接 Google Sheet 時出現，全部虛構）---------- */
const COSTS=[['1. 演職員費用（演員及編劇）','Artist Fee'],['2. 製作費及創作團隊','Production & Creative'],['3. 場地租金','Venue Rental'],['4. 市場推廣及宣傳','Marketing & Promotion'],['5. 票務管理','Ticketing Management'],['6. POPTicket 票務平台收費','Pop Ticket Charge'],['7. 應急／預備金','Contingency']];
function mk(name,shows,gross,fee,rate,costs,sponsor,merch,act,items){
  const net=gross*(1-fee),total=costs.reduce((a,b)=>a+b,0),other=sponsor+merch,be=Math.max(0,(total-other)/net);
  const p={name,shows,fullGross:gross,feePct:fee,fullNet:net,budgetRate:rate,budgetTicket:net*rate,totalCost:total,sponsor,merch,
    breakevenRate:be,breakevenGross:be*gross,fullPnL:net+other-total,budgetPnL:net*rate+other-total,
    risk:be>.8?'高風險':be>=.6?'中等':'較安全',
    costs:costs.map((b,i)=>({label:COSTS[i][0],en:COSTS[i][1],budget:b,actual:act?act.costs[i]:null,items:(items&&items[i])||[]})),
    actual:{ticket:null,sponsor:null,merch:null,totalCost:null,pnl:null}};
  if(act){const at=act.costs.reduce((a,b)=>a+b,0);p.actual={ticket:act.ticket,sponsor:act.sponsor,merch:act.merch,totalCost:at,pnl:act.ticket+act.sponsor+act.merch-at};}
  return p;
}
const it=(item,budget,actual,note)=>({item,budget,actual,note:note||''});
const SAMPLE={title:'舞台劇損益（示範）',updated:'示範資料',plays:[
  mk('海邊的房間',12,1440000,.05,.7,[380000,260000,180000,120000,30000,42000,50000],100000,20000,
    {ticket:1005000,sponsor:100000,merch:26500,costs:[380000,288000,180000,136500,30000,44100,21000]},
    [[it('主角 ×2',160000,160000),it('配角 ×4',140000,140000),it('編劇費',80000,80000)],
     [it('導演',70000,70000),it('佈景設計及製作',95000,118000,'加建旋轉台'),it('燈光設計',40000,40000),it('服裝',35000,40000,'加做兩套'),it('音響',20000,20000)],
     [it('劇場租金（12 場）',150000,150000),it('裝台／拆台日',30000,30000)],
     [it('Facebook / IG 廣告',50000,62000),it('海報及印刷',30000,32500),it('宣傳片拍攝',40000,42000)],
     [it('票務員',30000,30000)],[it('POPTicket 手續費',42000,44100)],[it('預備金',50000,21000)]]),
  mk('午夜電車',8,880000,.05,.75,[260000,190000,128000,90000,22000,28000,40000],50000,12000,
    {ticket:602000,sponsor:50000,merch:9800,costs:[260000,201500,128000,84000,22000,27600,38000]},
    [[it('演員 ×5',200000,200000),it('編劇費',60000,60000)],[it('導演',60000,60000),it('佈景',80000,91500),it('燈光及音響',50000,50000)]]),
  mk('老街裁縫',16,1600000,.05,.65,[520000,410000,256000,160000,40000,52000,60000],60000,15000,null,
    [[it('演員 ×8',420000,null),it('編劇費',100000,null)]]),
  mk('第七幕',6,540000,.05,.7,[150000,96000,84000,48000,15000,18000,20000],80000,6000,null,null)
]};
SAMPLE.plays[0].investors=[{name:'投資者 A（示範）',amount:25950,note:'佔 50%'},{name:'投資者 B（示範）',amount:15570,note:'佔 30%'},{name:'投資者 C（示範）',amount:10380,note:'佔 20%'}];
SAMPLE.plays[0].incomeItems={
  ticket:[it('正價票',819800,790000),it('優惠票（長者／學生）',137800,152000),it('團體票',0,63000,'學校包場兩場')],
  sponsor:[it('藝術發展局資助',80000,80000),it('企業贊助',20000,20000)],
  merch:[it('場刊',12000,15500),it('Tote bag 及明信片',8000,11000)]};

/* ---------- 計算 ---------- */
const hasActual=p=>p.actual&&(p.actual.pnl!=null||!!p.actual.ticket||p.costs.some(c=>c.actual!=null));
const actualCost=p=>!hasActual(p)?null:(p.actual.totalCost??p.costs.reduce((a,c)=>a+(c.actual??c.budget),0));
function actualPnL(p){
  if(!hasActual(p))return null;
  if(p.actual.pnl!=null)return p.actual.pnl;
  return (p.actual.ticket||0)+(p.actual.sponsor??p.sponsor)+(p.actual.merch??p.merch)-actualCost(p);
}
const riskClass=r=>/高/.test(r)?'r-high':/中/.test(r)?'r-mid':'r-low';
const riskDot=r=>/高/.test(r)?'var(--bad)':/中/.test(r)?'var(--warn)':'var(--good)';
const actRate=p=>hasActual(p)&&p.actual.ticket&&p.fullNet?p.actual.ticket/p.fullNet:null;

/* 圓環：值 v（0–1），可加一條刻度 t */
function ring(size,stroke,v,color,t){
  const r=(size-stroke)/2, C=2*Math.PI*r, c=size/2, val=Math.max(0,Math.min(1,v||0));
  const tick=t==null?'':(()=>{const a=(Math.min(1,t)*360-90)*Math.PI/180;const x1=c+(r-stroke/2-3)*Math.cos(a),y1=c+(r-stroke/2-3)*Math.sin(a),x2=c+(r+stroke/2+3)*Math.cos(a),y2=c+(r+stroke/2+3)*Math.sin(a);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;})();
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="${stroke}"/>
    <circle class="arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${reduced?C*(1-val):C}" data-off="${C*(1-val)}" transform="rotate(-90 ${c} ${c})"/>${tick}</svg>`;
}
function donut(parts,size,stroke){
  const r=(size-stroke)/2, C=2*Math.PI*r, c=size/2, tot=parts.reduce((a,p)=>a+p.v,0)||1; let off=0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="成本結構">`+parts.map(p=>{const len=p.v/tot*C;const s=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0,len-3)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"/>`;off+=len;return s;}).join('')+'</svg>';
}
function bar(b,a,max,isIncome){
  const bw=Math.min(100,max?b/max*100:0), aw=a==null?bw:Math.min(100,max?a/max*100:0);
  const bad=a!=null&&(isIncome?a<b:a>b);
  return `<div class="track" role="img" aria-label="預算 ${plain(b)}，實際 ${a==null?'未有':plain(a)}"><div class="fill${bad?' over':''}" style="width:${aw}%;${a==null?'opacity:.35;background:var(--muted)':''}"></div>${a==null?'':`<div class="mark" style="left:calc(${bw}% - 1px)"></div>`}</div>`;
}

/* ---------- 資料 ----------
   API_URL：Apps Script 網頁應用程式網址（/exec 結尾）。留空時顯示示範資料。 */
const API_URL='https://script.google.com/macros/s/AKfycbwyciLmRFC6x1NlS4zsLbooWzHKH7ctHtyW33v8FI2VhTUjiEkUEVSCSBwIcMHCagg3/exec';
const inGAS=typeof google!=='undefined'&&google.script&&google.script.run;
const reloadBtn=document.getElementById('reload');
const store={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}},del:k=>{try{localStorage.removeItem(k)}catch(_){}}};
function done(d){DATA=d;reloadBtn.classList.remove('spin');if(VIEW>=(DATA.plays||[]).length)VIEW=-1;render();}
function fail(msg){reloadBtn.classList.remove('spin');
  if(DATA){document.getElementById('updated').textContent='離線 · 顯示上次資料';return;}
  document.getElementById('view').innerHTML=`<div class="glass empty">${esc(msg)}</div>`;document.getElementById('updated').textContent='讀取失敗';}
function lockScreen(err){
  reloadBtn.classList.remove('spin');
  [...document.querySelectorAll('#seg button')].forEach(b=>b.remove());
  document.getElementById('segInd').style.width='0';
  document.getElementById('updated').textContent='需要存取碼';
  document.getElementById('view').innerHTML=`<form class="glass lock" id="lockForm"><h2>輸入存取碼</h2><p class="hint" style="margin:0">輸入一次之後，這部裝置會記住。</p>
    <input id="code" type="password" autocomplete="current-password" aria-label="存取碼" required>
    <button class="primary" type="submit">進入</button><div class="err">${esc(err||'')}</div></form>`;
  document.getElementById('lockForm').addEventListener('submit',e=>{e.preventDefault();store.set('pnl-key',document.getElementById('code').value.trim());load();});
  document.getElementById('code').focus();
}
function load(){
  reloadBtn.classList.add('spin');
  if(inGAS){google.script.run.withSuccessHandler(done).withFailureHandler(e=>fail('讀取失敗：'+(e.message||e))).getData();return;}
  if(!API_URL){setTimeout(()=>done(SAMPLE),300);return;}
  // 秘密連結：網址 #k=秘密連結碼，打開即自動登入（手動輸入的密碼不會放進網址）
  const m=location.hash.match(/^#k=(.+)$/);
  if(m){try{store.set('pnl-key',decodeURIComponent(m[1]).trim());}catch(_){}}
  const key=store.get('pnl-key');
  if(!key){lockScreen();return;}
  if(!DATA){const c=store.get('pnl-cache');if(c){try{done(JSON.parse(c));reloadBtn.classList.add('spin');}catch(_){}}}
  fetch(API_URL+'?key='+encodeURIComponent(key),{cache:'no-store'}).then(r=>r.json()).then(d=>{
    if(d.error==='unauthorized'){store.del('pnl-key');store.del('pnl-cache');DATA=null;try{history.replaceState(null,'',location.pathname);}catch(_){}lockScreen('存取碼不正確，或連結已失效');return;}
    if(d.error){fail('讀取失敗：'+d.error);return;}
    store.set('pnl-cache',JSON.stringify(d));done(d);
  }).catch(()=>fail('連線失敗，請檢查網絡後按「更新」。'));
}
reloadBtn.addEventListener('click',load);

/* ---------- 切換：View Transitions 共享元素變形，不支援時用彈入動畫 ---------- */
function go(i,fromEl){
  if(i===VIEW)return;
  const prev=VIEW;
  const swap=()=>{VIEW=i;render(true);window.scrollTo(0,0);};
  if(document.startViewTransition&&!reduced){
    // 只為來回的那一張卡命名，讓它變形成詳細頁頂部（返回時反過來）
    const name=el=>{if(el)el.style.viewTransitionName='hero';};
    const fwd=prev<0&&i>=0, back=prev>=0&&i<0;
    if(fwd)name(document.querySelector(`.play[data-go="${i}"]`));
    if(back)name(document.querySelector('.d-hero'));
    const vt=document.startViewTransition(()=>{swap();
      if(fwd)name(document.querySelector('.d-hero'));
      if(back)name(document.querySelector(`.play[data-go="${prev}"]`));
    });
    vt.finished.finally(()=>document.querySelectorAll('.play,.d-hero').forEach(e=>e.style.viewTransitionName=''));
  }else swap();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)go(+t.dataset.go,t);});
/* 跟隨游標的光暈 */
document.addEventListener('pointermove',e=>{const el=e.target.closest('.lit');if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});

function moveInd(){
  const seg=document.getElementById('seg'), cur=seg.querySelector('[aria-current="true"]'), ind=document.getElementById('segInd');
  if(!cur){ind.style.width='0';return;}
  ind.style.width=cur.offsetWidth+'px'; ind.style.transform=`translateX(${cur.offsetLeft}px)`;
  cur.scrollIntoView({block:'nearest',inline:'nearest',behavior:reduced?'auto':'smooth'});
}
window.addEventListener('resize',moveInd);

function render(nav){
  if(!DATA)return;
  document.getElementById('appTitle').textContent=(DATA.title||'舞台劇損益').replace(/（副本）/,'');
  document.getElementById('updated').textContent=DATA.updated==='示範資料'?'示範資料':'更新於 '+DATA.updated;
  const P=DATA.plays||[], seg=document.getElementById('seg');
  [...seg.querySelectorAll('button')].forEach(b=>b.remove());
  seg.insertAdjacentHTML('beforeend',`<button type="button" data-go="-1" aria-current="${VIEW<0}">總覽</button>`+
    P.map((p,i)=>`<button type="button" data-go="${i}" aria-current="${VIEW===i}"><span class="dot" style="background:${riskDot(p.risk)}"></span>${esc(p.name)}</button>`).join(''));
  requestAnimationFrame(moveInd);
  const v=document.getElementById('view');
  v.innerHTML=(DATA===SAMPLE?'<div class="glass demo">示範資料（全部虛構）。連接 Google Sheet 後會顯示真實數字。</div>':'')+(VIEW<0?homeHTML(P):detailHTML(P[VIEW],VIEW));
  if(!(nav&&document.startViewTransition&&!reduced)){v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');}
  if(VIEW>=0)wireDetail(P[VIEW]);
  // 圓環動畫＋數字滾動
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.arc').forEach(a=>a.style.strokeDashoffset=a.dataset.off)));
  document.querySelectorAll('[data-count]').forEach(countUp);
}
function countUp(el){
  const target=+el.dataset.count; if(isNaN(target)||reduced)return;
  const t0=performance.now(),dur=900;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);el.innerHTML=money(target*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ---------- 總覽 ---------- */
function homeHTML(P){
  if(!P.length)return '<div class="glass empty">表格裡還未有劇目。在「輸入與計算」的「劇名」一行填上劇名，再按「更新」。</div>';
  const maxCost=Math.max(...P.map(p=>Math.max(p.totalCost,actualCost(p)||0)),1);
  return `
  <section class="sec">
    <div class="sec-h"><h2>劇目</h2><span class="hint">點擊查看詳細花費</span></div>
    <div class="plays">${P.map((p,i)=>{const ap=actualPnL(p),ac=actualCost(p),rate=actRate(p)??p.budgetRate;const main=ap??p.budgetPnL;
      return `<button class="play glass lit reveal" type="button" data-go="${i}">
        <div class="p-top"><div><div class="p-no n">No.${String(i+1).padStart(2,'0')}</div><div class="p-name">${esc(p.name)}</div><div class="p-meta">${p.shows} 場 · 滿座票房 <span class="n">${plain(p.fullGross)}</span></div></div><span class="pill ${riskClass(p.risk)}">${esc(p.risk||'—')}</span></div>
        <div class="p-mid">
          <div><div class="lbl">${ap==null?'預算損益':'實際損益'}</div><div class="p-big n ${tone(main)}">${money(main)}</div><div class="p-sub">${ap==null?'實際數字未填':'預算 '+plain(p.budgetPnL)}</div></div>
          <div class="p-ring">${ring(72,7,rate,rate>=p.breakevenRate?'var(--good)':'var(--bad)',p.breakevenRate)}<b class="n">${pct(rate).replace('.0','')}</b><small>${actRate(p)==null?'預算售票':'實際售票'}</small></div>
        </div>
        <div class="p-bar"><div class="p-bar-h"><span>成本${ac==null?'（預算）':' 實際／預算'}</span><span class="n">${ac==null?plain(p.totalCost):plain(ac)+' / '+plain(p.totalCost)}</span></div>${bar(p.totalCost,ac,maxCost)}</div>
        <div class="p-foot"><span>保本線 <b class="n">${pct(p.breakevenRate)}</b></span><span class="go">詳情 ${ARROW}</span></div>
      </button>`;}).join('')}</div>
  </section>`;
}

/* 投資者分配：每位投資者分得多少 */
function invHTML(list,pnl,act){
  if(!list||!list.length)return '';
  const sum=list.reduce((a,x)=>a+(x.amount||0),0), left=pnl-sum;
  const max=Math.max(...list.map(x=>Math.abs(x.amount||0)),1);
  return `<div class="inv">
    <div class="inv-h"><span class="inv-t">投資者分配</span><span class="hint">${list.length} 位 · 已分配 <b class="n">${plain(sum)}</b>${Math.round(left)===0?' · ✓ 全數分配':` · ${act?'實際':'預算'}損益尚餘 <b class="n">${plain(left)}</b>`}</span></div>
    <div class="inv-list">${list.map(x=>`<div class="inv-r">
      <div class="inv-n"><span>${esc(x.name)}</span>${x.note?`<small>${esc(x.note)}</small>`:''}</div>
      <div class="inv-bar"><i class="${x.amount<0?'neg-b':''}" style="width:${Math.abs(x.amount||0)/max*100}%"></i></div>
      <div class="inv-v n ${tone(x.amount)}">${money(x.amount)}</div></div>`).join('')}</div>
  </div>`;
}

/* ---------- 劇目詳細（Bento）---------- */
function diffCell(b,a,isCost){if(a==null)return '<span class="na">—</span>';const d=a-b;const c=isCost?(d>0?'neg':d<0?'pos':''):tone(d);return `<span class="${c}">${signed(d)}</span>`;}
function detailHTML(p,idx){
  const ap=actualPnL(p), ac=actualCost(p), act=ap!=null, dd=act?ap-p.budgetPnL:null;
  const incB=p.budgetTicket+p.sponsor+p.merch;
  const incA=act?(p.actual.ticket||0)+(p.actual.sponsor??p.sponsor)+(p.actual.merch??p.merch):incB;
  const pnl=act?ap:p.budgetPnL, ar=actRate(p), rate=ar??p.budgetRate;
  const maxC=Math.max(...p.costs.map(c=>Math.max(c.budget,c.actual||0)),1);
  const firstOver=p.costs.findIndex(c=>c.actual!=null&&c.actual>c.budget);
  const openK=firstOver>=0?firstOver:0, tot=p.totalCost||1;

  // 一個可展開的類別（花費或收入共用，字體和排位完全一樣）
  const catRow=(o)=>{
    const items=o.items||[], sb=items.reduce((a,x)=>a+x.budget,0);
    const mis=items.length&&Math.round(sb)!==Math.round(o.budget);
    return `<div class="cat${o.open?' open':''}">
      <button class="cat-h" type="button" aria-expanded="${!!o.open}">
        ${CHEV}
        <div class="c-name"><i style="background:${o.color}"></i><span>${esc(o.label)}<small>${esc(o.en||'')}${items.length?`${o.en?' · ':''}${items.length} 個細項`:''}</small></span></div>
        <div class="c-num n"><em>預算</em>${money(o.budget)}</div>
        <div class="c-num n"><em>實際</em>${o.actual==null?'<span class="na">—</span>':money(o.actual)}</div>
        <div class="c-num n"><em>差異</em>${diffCell(o.budget,o.actual,!o.income)}</div>
        <div class="c-bar">${bar(o.budget,o.actual,o.max,o.income)}</div>
      </button>
      <div class="cat-b"><div><div class="items">
        ${items.length?items.map(x=>`<div class="item"><div>${esc(x.item)}${x.note?`<small>${esc(x.note)}</small>`:''}</div>
          <div class="c-num n"><em>預算</em>${money(x.budget)}</div><div class="c-num n"><em>實際</em>${x.actual==null?'<span class="na">—</span>':money(x.actual)}</div><div class="c-num n"><em>差異</em>${diffCell(x.budget,x.actual,!o.income)}</div></div>`).join('')
          :'<div class="none">未有細項。在 Sheet 這齣劇的細項分頁加入即可。</div>'}
        ${mis?`<div class="mis">細項預算合計 ${plain(sb)}，跟主表 ${plain(o.budget)} 相差 ${plain(sb-o.budget)}</div>`:''}
      </div></div></div>
    </div>`;};
  const cats=p.costs.map((c,k)=>catRow({label:short(c.label),en:c.en,color:`var(--c${k+1})`,budget:c.budget,actual:c.actual,items:c.items,max:maxC,open:k===openK})).join('');
  const II=p.incomeItems||{};
  const incList=[
    {label:'門票收入',en:'已扣手續費',color:'var(--good)',budget:p.budgetTicket,actual:p.actual.ticket,items:II.ticket},
    {label:'贊助／資助',en:'',color:'var(--c2)',budget:p.sponsor,actual:p.actual.sponsor,items:II.sponsor},
    {label:'場刊及周邊',en:'',color:'var(--c5)',budget:p.merch,actual:p.actual.merch,items:II.merch}];
  const maxI=Math.max(...incList.map(x=>Math.max(x.budget||0,x.actual||0)),1);
  const incs=incList.map(x=>catRow({...x,income:true,max:maxI})).join('');
  const incTotB=incList.reduce((a,x)=>a+(x.budget||0),0);

  return `<div class="bento">
    <section class="tile glass lit d-hero s4">
      <div class="d-head">
        <div class="d-top"><div><div class="p-no n">No.${String(idx+1).padStart(2,'0')} · ${p.shows} 場 · 滿座票房 ${plain(p.fullGross)}</div><h1 class="d-name">${esc(p.name)}</h1></div><span class="pill ${riskClass(p.risk)}">${esc(p.risk||'—')}</span></div>
        <div class="eq">
          <div class="eq-row"><span class="eq-op"></span><div><div class="eq-l">收入${act?'':'（預算）'}</div><div class="eq-s">${act?'預算 '+plain(incB):'門票＋贊助＋周邊'}</div></div><span class="eq-v n">${money(incA)}</span></div>
          <div class="eq-row"><span class="eq-op">−</span><div><div class="eq-l">成本${act?'':'（預算）'}</div><div class="eq-s">${act?'預算 '+plain(p.totalCost):'七項成本合計'}</div></div><span class="eq-v n">${money(ac??p.totalCost)}</span></div>
          <div class="eq-row eq-r ${tone(pnl)}"><span class="eq-op">=</span><div><div class="eq-l">${act?'實際損益':'預算損益'}</div><div class="eq-s">${act?(dd>=0?'▲ 比預算多 ':'▼ 比預算少 ')+plain(Math.abs(dd)):'實際數字未填'}</div></div><span class="eq-v n" data-count="${pnl}">${money(pnl)}</span></div>
        </div>
        ${invHTML(p.investors,pnl,act)}
      </div>
    </section>

    <section class="tile glass lit ring-tile s2">
      <span class="lbl">${ar==null?'預算售票率':'實際售票率'}</span>
      <div class="ring">${ring(150,14,rate,rate>=p.breakevenRate?'var(--good)':'var(--bad)',p.breakevenRate)}<div class="ring-c"><b class="n">${pct(rate)}</b><span>${rate>=p.breakevenRate?'已過保本線':'未到保本線'}</span></div></div>
      <div class="ring-leg"><span><i style="background:var(--ink)"></i>保本 ${pct(p.breakevenRate)}</span>${ar==null?'':`<span>預算 ${pct(p.budgetRate)}</span>`}</div>
    </section>

    <section class="tile glass lit s3 reveal">
      <div class="sec-h" style="padding:0 0 12px"><h2>成本結構</h2><span class="hint n">${plain(p.totalCost)}</span></div>
      <div class="mix">
        <div class="mix-d">${donut(p.costs.map((c,k)=>({v:c.budget,c:`var(--c${k+1})`})),120,16)}<b class="n">7 項</b></div>
        <div class="leg">${p.costs.map((c,k)=>`<div><i style="background:var(--c${k+1})"></i><span>${esc(short(c.label))}</span><b class="n">${pct(c.budget/tot)}</b></div>`).join('')}</div>
      </div>
    </section>

    <section class="tile glass lit scen s3 reveal">
      <div class="scen-row"><h2>售票率試算</h2><span class="hint">保本 ${pct(p.breakevenRate)}</span></div>
      <div class="scen-row"><span>如果賣到 <b class="n" id="rateV"></b></span><span class="scen-big n" id="scenV"></span></div>
      <input type="range" id="rate" min="0" max="100" value="${Math.round(p.budgetRate*100)}" aria-label="假設售票率">
      <div class="note">損益 ＝ 售票率 × 滿座淨票房 ＋ 其他收入 − 總成本</div>
    </section>

    <section class="tile glass s6 reveal">
      <div class="sec-h" style="padding:0 0 4px"><h2>花費明細</h2><span class="hint">點類別展開細項 · 紅＝超支</span></div>
      <div class="cols"><span></span><span>類別</span><span>預算</span><span>實際</span><span>差異</span></div>
      <div>${cats}</div>
      <div class="tot"><span></span><div class="c-name">總成本</div><div class="c-num n"><em>預算</em>${money(p.totalCost)}</div><div class="c-num n"><em>實際</em>${ac==null?'<span class="na">—</span>':money(ac)}</div><div class="c-num n"><em>差異</em>${diffCell(p.totalCost,ac,true)}</div></div>
    </section>

    <section class="tile glass s6 reveal">
      <div class="sec-h" style="padding:0 0 4px"><h2>收入</h2><span class="hint">點類別展開細項 · 紅＝少於預算</span></div>
      <div class="cols"><span></span><span>類別</span><span>預算</span><span>實際</span><span>差異</span></div>
      <div>${incs}</div>
      <div class="tot"><span></span><div class="c-name">收入合計</div><div class="c-num n"><em>預算</em>${money(incTotB)}</div><div class="c-num n"><em>實際</em>${act?money(incA):'<span class="na">—</span>'}</div><div class="c-num n"><em>差異</em>${act?diffCell(incTotB,incA,false):'<span class="na">—</span>'}</div></div>
      <div class="tot" style="border-top:0;padding-top:8px"><span></span><div class="c-name">最終損益</div><div class="c-num n ${tone(p.budgetPnL)}"><em>預算</em>${money(p.budgetPnL)}</div><div class="c-num n ${act?tone(ap):'na'}"><em>實際</em>${act?money(ap):'—'}</div><div class="c-num n"><em>差異</em>${act?diffCell(p.budgetPnL,ap,false):'<span class="na">—</span>'}</div></div>
      <div class="note" style="padding:10px 8px 0">滿座票房 ${plain(p.fullGross)} · 手續費 ${pct(p.feePct)} · 滿座淨票房 ${plain(p.fullNet)} · 每場平均成本 ${plain(p.shows?p.totalCost/p.shows:null)}</div>
    </section>
  </div>`;
}
function wireDetail(p){
  document.querySelectorAll('.cat-h').forEach(b=>b.addEventListener('click',()=>{const c=b.parentElement;const o=c.classList.toggle('open');b.setAttribute('aria-expanded',o);}));
  const r=document.getElementById('rate'),rv=document.getElementById('rateV'),sv=document.getElementById('scenV'),other=p.sponsor+p.merch;
  const upd=()=>{const v=r.value/100*p.fullNet+other-p.totalCost;rv.textContent=r.value+'%';sv.innerHTML=money(v);sv.className='scen-big n '+tone(v);r.style.setProperty('--p',r.value+'%');};
  r.addEventListener('input',upd);upd();
}

load();
</script>

</body>
</html>
