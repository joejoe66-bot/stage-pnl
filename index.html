<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141829" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="劇目損益">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>舞台劇損益</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: 固定外框（頂欄＋劇目切換列）＋ 內容區切換動畫。總覽：深色淨額卡 → 需要留意 → 劇目卡；劇目：深色卡 → 花費明細(可展開細項) → 收入 → 試算 */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --sunk:#f6f7fa; --ink:#121628; --muted:#687089; --line:#e2e5ee;
  --hero1:#141b3a; --hero2:#0f2a3d; --hero-ink:#f4f1e8; --hero-muted:#aab3cc; --gold:#e3b75c;
  --accent:#141b3a; --chip-on:#141b3a; --chip-on-ink:#ffffff;
  --good:#15845a; --good-soft:#e1f3ea; --bad:#d63a2f; --bad-soft:#fde8e6; --warn:#b06f00; --warn-soft:#fbf0d8;
  --c1:#e3b75c; --c2:#3f7df0; --c3:#19a7a1; --c4:#e46a86; --c5:#8b68d6; --c6:#7c8aa8; --c7:#9cb53b;
  --shadow:0 1px 2px rgba(18,22,40,.04),0 8px 24px rgba(18,22,40,.06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Manrope","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e1a; --surface:#141829; --sunk:#10142a; --ink:#eceef6; --muted:#98a0bd; --line:#252a44;
  --hero1:#1a2350; --hero2:#0e3346; --hero-ink:#f4f1e8; --hero-muted:#aab3cc;
  --accent:#e3b75c; --chip-on:#e3b75c; --chip-on-ink:#0b0e1a;
  --good:#4fd09a; --good-soft:#123425; --bad:#ff7a70; --bad-soft:#3b1b19; --warn:#f2bf57; --warn-soft:#382c12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e1a; --surface:#141829; --sunk:#10142a; --ink:#eceef6; --muted:#98a0bd; --line:#252a44;
  --hero1:#1a2350; --hero2:#0e3346; --hero-ink:#f4f1e8; --hero-muted:#aab3cc;
  --accent:#e3b75c; --chip-on:#e3b75c; --chip-on-ink:#0b0e1a;
  --good:#4fd09a; --good-soft:#123425; --bad:#ff7a70; --bad-soft:#3b1b19; --warn:#f2bf57; --warn-soft:#382c12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.cur{opacity:.55;font-weight:600;margin-right:1px}
.pos{color:var(--good)} .neg{color:var(--bad)} .na{color:var(--muted)}

/* ---------- 固定外框 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.in{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--gold);display:grid;place-items:center;font-weight:900;flex:none}
.ttl{min-width:0}
.ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:12px;color:var(--muted)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;flex:none}
.btn:hover{border-color:var(--ink)}
.btn svg{width:15px;height:15px}
.btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-current="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip .dot{width:7px;height:7px;border-radius:50%}

/* ---------- 內容區 ---------- */
main{padding-block:22px 72px}
.view{display:grid;gap:22px}
.view.enter > *{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
.view.enter > :nth-child(2){animation-delay:.06s} .view.enter > :nth-child(3){animation-delay:.12s}
.view.enter > :nth-child(4){animation-delay:.18s} .view.enter > :nth-child(5){animation-delay:.24s}
.view.enter .play{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
.view.enter .play:nth-child(2){animation-delay:.2s} .view.enter .play:nth-child(3){animation-delay:.26s} .view.enter .play:nth-child(n+4){animation-delay:.32s}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.view.enter .b-act,.view.enter .b-bud{animation:grow .8s .25s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{width:0}}
.view.enter .donut-wrap svg{animation:pop .7s .15s cubic-bezier(.2,.8,.2,1.1) both}
@keyframes pop{from{opacity:0;transform:rotate(-60deg) scale(.85)}to{opacity:1;transform:none}}
.demo{background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
h2{font-size:17px;font-weight:700;margin:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.lbl{font-size:12px;color:var(--muted);font-weight:500}

/* ---------- 深色主卡 ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px;color:var(--hero-ink);background:linear-gradient(135deg,var(--hero1),var(--hero2));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::after{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(227,183,92,.22),transparent 65%);pointer-events:none}
.hero .lbl{color:var(--hero-muted)}
.h-main{display:grid;gap:6px;min-width:0;position:relative;z-index:1}
.h-big{font-size:clamp(34px,6vw,52px);font-weight:800;line-height:1.05}
.h-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;justify-self:start}
.h-tag.up{background:rgba(79,208,154,.18);color:#7fe3b6} .h-tag.down{background:rgba(255,122,112,.18);color:#ff9d95} .h-tag.flat{background:rgba(255,255,255,.12);color:var(--hero-ink)}
.h-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.h-stats .v{font-size:19px;font-weight:700}
.donut-wrap{position:relative;z-index:1;display:grid;place-items:center}
.donut-c{position:absolute;text-align:center;display:grid}
.donut-c b{font-size:16px;font-weight:800}
.donut-c span{font-size:11px;color:var(--hero-muted)}
@media (max-width:700px){.hero{grid-template-columns:1fr}.donut-wrap{justify-self:start}.h-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- 需要留意 ---------- */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.alert:hover{border-color:var(--ink)}
.a-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px}
.a-ic.bad{background:var(--bad-soft);color:var(--bad)} .a-ic.warn{background:var(--warn-soft);color:var(--warn)}
.a-t{font-size:14px;font-weight:600}
.a-s{font-size:12px;color:var(--muted)}
.ok{padding:14px;border-radius:12px;background:var(--good-soft);color:var(--good);font-size:14px;font-weight:500}

/* ---------- 劇目卡 ---------- */
.plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.play{border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;gap:16px;text-align:left;width:100%;transition:transform .18s,border-color .18s,box-shadow .18s}
.play:hover{transform:translateY(-3px);border-color:var(--ink)}
.p-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.p-name{font-size:19px;font-weight:700;line-height:1.3;text-wrap:balance}
.p-meta{font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.r-low{background:var(--good-soft);color:var(--good)} .r-mid{background:var(--warn-soft);color:var(--warn)} .r-high{background:var(--bad-soft);color:var(--bad)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .v{font-size:22px;font-weight:800;line-height:1.2}
.p-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.p-foot b{color:var(--ink)}
.go{font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:4px}

/* 子彈圖 */
.bl{display:grid;gap:6px}
.bl-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bullet{position:relative;height:10px;border-radius:5px;background:var(--sunk);border:1px solid var(--line)}
.b-bud{position:absolute;inset:0 auto 0 0;border-radius:5px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.b-act{position:absolute;top:2px;bottom:2px;left:0;border-radius:3px;background:var(--good);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.b-act.over{background:var(--bad)}
.b-tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}

/* ---------- 劇目詳細 ---------- */
.panel{padding:20px;display:grid;gap:14px}
.cat{border-bottom:1px solid var(--line)}
.cat:first-child{border-top:1px solid var(--line)}
.cat-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:20px minmax(0,1fr) repeat(3,minmax(88px,auto));gap:6px 14px;align-items:center;padding:14px 6px;border-radius:10px}
.cat-h:hover{background:var(--sunk)}
.cat-h:focus-visible{outline:2px solid var(--accent)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .25s}
.cat.open .chev{transform:rotate(90deg)}
.c-name{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700}
.c-name i{flex:none;width:10px;height:10px;border-radius:3px}
.c-name small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.c-num{text-align:right;font-size:14px;font-weight:700}
.c-num em{display:none;font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.c-bar{grid-column:2 / -1}
.cat-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.7,.2,1)}
.cat.open .cat-b{grid-template-rows:1fr}
.cat-b > div{overflow:hidden}
.items{padding:0 6px 14px 40px;display:grid;gap:4px}
.item{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(88px,auto));gap:14px;padding:9px 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.item small{display:block;font-size:12px;color:var(--muted)}
.item .c-num{font-weight:500}
.none{font-size:13px;color:var(--muted);padding:8px 12px}
.mis{font-size:12px;color:var(--warn);padding:4px 12px}
.cols,.tot{display:grid;grid-template-columns:20px minmax(0,1fr) repeat(3,minmax(88px,auto));gap:14px;padding-inline:6px}
.cols{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:8px}
.cols span:nth-child(n+3){text-align:right}
.tot{padding-top:14px;font-weight:800}
.tot .c-num{font-size:15px}
@media (max-width:620px){
  .cols{display:none}
  .cat-h,.tot{grid-template-columns:20px repeat(3,minmax(0,1fr))}
  .c-name{grid-column:2 / -1}
  .cat-h > :nth-child(3),.tot > :nth-child(3){grid-column:2}
  .cat-h > :nth-child(4),.tot > :nth-child(4){grid-column:3}
  .cat-h > :nth-child(5),.tot > :nth-child(5){grid-column:4}
  .c-num{text-align:left} .c-num em{display:block}
  .items{padding-left:6px}
  .item{grid-template-columns:repeat(3,minmax(0,1fr))}
  .item > :first-child{grid-column:1 / -1}
}
.inc-r{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(88px,auto));gap:14px;padding:11px 6px;border-bottom:1px solid var(--line);font-size:14px}
.inc-r > :not(:first-child){text-align:right}
.inc-r.h{font-size:11px;font-weight:700;color:var(--muted);padding-block:0 8px}
.inc-r.t{border-bottom:0;font-weight:800;font-size:15px}
@media (max-width:620px){.inc-r{grid-template-columns:repeat(3,minmax(0,1fr))}.inc-r > :first-child{grid-column:1 / -1;font-weight:700}.inc-r > :not(:first-child){text-align:left}.inc-r.h{display:none}.inc-r .c-num em{display:block}}
.scen{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.scen input{grid-column:1 / -1;width:100%;accent-color:var(--hero1)}
:root[data-theme="dark"] .scen input{accent-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scen input{accent-color:var(--gold)}}
.scen .big{font-size:30px;font-weight:800;text-align:right}
.note{font-size:12px;color:var(--muted)}

/* 劇目頁頂部 */
.ph{padding:22px;display:grid;gap:22px}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph-meta{font-size:12px;color:var(--muted);letter-spacing:.04em}
.ph-name{margin:2px 0 0;font-size:clamp(26px,4.5vw,34px);font-weight:900;line-height:1.2;text-wrap:balance}
.eq{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.15fr);align-items:stretch;gap:10px}
.eq-c{display:grid;gap:2px;align-content:center;padding:14px 16px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);min-width:0}
.eq-v{font-size:clamp(20px,3vw,26px);font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-s{font-size:12px;color:var(--muted)}
.eq-op{align-self:center;font-size:22px;font-weight:300;color:var(--muted)}
.eq-r.pos{background:var(--good-soft);border-color:transparent} .eq-r.neg{background:var(--bad-soft);border-color:transparent}
.eq-r.pos .eq-s,.eq-r.neg .eq-s{color:inherit;opacity:.85;font-weight:600}
@media (max-width:640px){.eq{grid-template-columns:1fr 1fr}.eq-op{display:none}.eq-r{grid-column:1 / -1}}
.seat{display:grid;gap:8px;padding-top:4px}
.seat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.seat-t{position:relative;height:14px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);margin-top:22px}
.seat-f{position:absolute;inset:0 auto 0 0;border-radius:7px}
.seat-f.s-ok{background:linear-gradient(90deg,color-mix(in srgb,var(--good) 55%,transparent),var(--good))}
.seat-f.s-low{background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 55%,transparent),var(--bad))}
.view.enter .seat-f{animation:grow .9s .2s cubic-bezier(.2,.7,.2,1) both}
.seat-m{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink)}
.seat-m span{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink)}
.seat-m.bd{background:var(--muted)} .seat-m.bd span{color:var(--muted);bottom:auto;top:calc(100% + 2px)}
.seat-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.mix{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.stack span{display:block;height:100%}
.stack{transform-origin:left}
.view.enter .stack{animation:wipe .9s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes wipe{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.lock{max-width:380px;margin:40px auto;padding:28px;display:grid;gap:14px;text-align:center}
.lock h2{font-size:20px}
.lock input{font:inherit;font-size:18px;text-align:center;letter-spacing:.2em;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.lock .primary{border:0;border-radius:12px;padding:12px;font-weight:700;background:var(--chip-on);color:var(--chip-on-ink)}
.lock .err{color:var(--bad);font-size:13px;min-height:1em}
.empty{padding:36px;text-align:center;color:var(--muted)}
.skel{height:160px;border-radius:22px;background:linear-gradient(90deg,var(--surface),var(--sunk),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="shell"><div class="in">
  <div class="top">
    <div class="logo" aria-hidden="true">劇</div>
    <div class="ttl"><b id="appTitle">舞台劇損益</b><span id="updated">載入中…</span></div>
    <div class="sp"></div>
    <button class="btn" id="reload" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>更新</button>
  </div>
  <nav class="chips" id="chips" aria-label="切換劇目"></nav>
</div></div>

<main class="in"><div class="view" id="view"><div class="skel"></div><div class="skel" style="height:220px"></div></div></main>

<script>
const HK=new Intl.NumberFormat('zh-HK',{maximumFractionDigits:0});
const money=v=>(v==null||isNaN(v))?'—':`${v<0?'−':''}<span class="cur">$</span>${HK.format(Math.abs(Math.round(v)))}`;
const plain=v=>(v==null||isNaN(v))?'—':`${v<0?'−':''}$${HK.format(Math.abs(Math.round(v)))}`;

const tone=v=>v==null?'na':v>0?'pos':v<0?'neg':'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function mk(name,shows,gross,fee,rate,costs,sponsor,merch,act,items){
  const net=gross*(1-fee),total=costs.reduce((a,b)=>a+b,0),other=sponsor+merch,be=Math.max(0,(total-other)/net);
  const p={name,shows,fullGross:gross,feePct:fee,fullNet:net,budgetRate:rate,budgetTicket:net*rate,totalCost:total,sponsor,merch,
    breakevenRate:be,breakevenGross:be*gross,fullPnL:net+other-total,budgetPnL:net*rate+other-total,
    risk:be>.8?'高風險':be>=.6?'中等':'較安全',
    costs:costs.map((b,i)=>({label:COSTS[i][0],en:COSTS[i][1],budget:b,actual:act?act.costs[i]:null,items:(items&&items[i])||[]})),
    actual:{ticket:null,sponsor:null,merch:null,totalCost:null,pnl:null}};
  if(act){const at=act.costs.reduce((a,b)=>a+b,0);p.actual={ticket:act.ticket,sponsor:act.sponsor,merch:act.merch,totalCost:at,pnl:act.ticket+act.sponsor+act.merch-at};}
  return p;
}

/* ---------- 計算 ---------- */
const hasActual=p=>p.actual&&(p.actual.pnl!=null||!!p.actual.ticket||p.costs.some(c=>c.actual!=null));
const actualCost=p=>!hasActual(p)?null:(p.actual.totalCost??p.costs.reduce((a,c)=>a+(c.actual??c.budget),0));
function actualPnL(p){
  if(!hasActual(p))return null;
  if(p.actual.pnl!=null)return p.actual.pnl;
  return (p.actual.ticket||0)+(p.actual.sponsor??p.sponsor)+(p.actual.merch??p.merch)-actualCost(p);
}
const riskClass=r=>/高/.test(r)?'r-high':/中/.test(r)?'r-mid':'r-low';
const riskDot=r=>/高/.test(r)?'var(--bad)':/中/.test(r)?'var(--warn)':'var(--good)';
function bullet(b,a,max){
  const bw=Math.min(100,max?b/max*100:0), aw=a==null?0:Math.min(100,max?a/max*100:0);
  return `<div class="bullet" role="img" aria-label="預算 ${plain(b)}，實際 ${a==null?'未有':plain(a)}"><div class="b-bud" style="width:${bw}%"></div>${a==null?'':`<div class="b-act${a>b?' over':''}" style="width:${aw}%"></div>`}<div class="b-tick" style="left:calc(${bw}% - 1px)"></div></div>`;
}
function donut(parts,size){
  const r=size/2-9, C=2*Math.PI*r, tot=parts.reduce((a,p)=>a+p.v,0)||1; let off=0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="成本結構"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="14"/>`+
    parts.map(p=>{const len=p.v/tot*C;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="14" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(p.l)} ${pct(p.v/tot)}</title></circle>`;off+=len;return s;}).join('')+'</svg>';
}
const catParts=costs=>costs.map((c,k)=>({v:c.budget,c:`var(--c${k+1})`,l:short(c.label)}));

/* ---------- 資料 ----------
   API_URL：Apps Script 網頁應用程式網址（/exec 結尾）。留空時顯示示範資料。 */
const API_URL='https://script.google.com/macros/s/AKfycbwyciLmRFC6x1NlS4zsLbooWzHKH7ctHtyW33v8FI2VhTUjiEkUEVSCSBwIcMHCagg3/exec';
const inGAS=typeof google!=='undefined'&&google.script&&google.script.run;
const reloadBtn=document.getElementById('reload');
const store={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}},del:k=>{try{localStorage.removeItem(k)}catch(_){}}};
function done(d){DATA=d;reloadBtn.classList.remove('spin');if(VIEW>=(DATA.plays||[]).length)VIEW=-1;render(false);}
function fail(msg){reloadBtn.classList.remove('spin');
  if(DATA){document.getElementById('updated').textContent='離線 · 顯示上次資料';return;}
  document.getElementById('view').innerHTML=`<div class="card empty">${esc(msg)}</div>`;document.getElementById('updated').textContent='讀取失敗';}
function lockScreen(err){
  reloadBtn.classList.remove('spin');
  document.getElementById('chips').innerHTML='';
  document.getElementById('updated').textContent='需要存取碼';
  document.getElementById('view').innerHTML=`<form class="card lock" id="lockForm"><h2>輸入存取碼</h2><p class="hint" style="margin:0">輸入一次之後，這部裝置會記住。</p>
    <input id="code" type="password" inputmode="text" autocomplete="current-password" aria-label="存取碼" required>
    <button class="primary" type="submit">進入</button><div class="err">${esc(err||'')}</div></form>`;
  const f=document.getElementById('lockForm');
  f.addEventListener('submit',e=>{e.preventDefault();store.set('pnl-key',document.getElementById('code').value.trim());load();});
  document.getElementById('code').focus();
}
function load(){
  reloadBtn.classList.add('spin');
  if(inGAS){google.script.run.withSuccessHandler(done).withFailureHandler(e=>fail('讀取失敗：'+(e.message||e))).getData();return;}
  if(!API_URL){setTimeout(()=>done(SAMPLE),250);return;}
  const key=store.get('pnl-key');
  if(!key){lockScreen();return;}
  if(!DATA){const c=store.get('pnl-cache');if(c){try{done(JSON.parse(c));reloadBtn.classList.add('spin');}catch(_){}}}
  fetch(API_URL+'?key='+encodeURIComponent(key),{cache:'no-store'}).then(r=>r.json()).then(d=>{
    if(d.error==='unauthorized'){store.del('pnl-key');store.del('pnl-cache');DATA=null;lockScreen('存取碼不正確');return;}
    if(d.error){fail('讀取失敗：'+d.error);return;}
    store.set('pnl-cache',JSON.stringify(d));done(d);
  }).catch(()=>fail('連線失敗，請檢查網絡後按「更新」。'));
}
reloadBtn.addEventListener('click',load);

/* 主數字由 0 滾到目標值 */
function countUp(el){
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const target=+el.dataset.v; if(isNaN(target))return;
  const t0=performance.now(), dur=700;
  const step=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);el.innerHTML=money(target*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

  if(!P.length)return '<div class="card empty">表格裡還未有劇目。在「輸入與計算」的「劇名」一行填上劇名，再按「更新」。</div>';
  const sum=f=>P.reduce((a,p)=>a+(f(p)||0),0);
  const acts=P.filter(hasActual);
  const net=sum(p=>p.fullNet),other=sum(p=>p.sponsor+p.merch),cost=sum(p=>p.totalCost);
  const be=net?Math.max(0,(cost-other)/net):null, bud=sum(p=>p.budgetPnL);
  const act=acts.reduce((a,p)=>a+actualPnL(p),0), actBud=acts.reduce((a,p)=>a+p.budgetPnL,0);
  const main=acts.length?act:bud, d=act-actBud;
  const agg=COSTS.map((_,k)=>({label:P[0].costs[k]?.label||COSTS[k][0],budget:sum(p=>p.costs[k]?p.costs[k].budget:0)}));
  const maxCost=Math.max(...P.map(p=>Math.max(p.totalCost,actualCost(p)||0)),1);

  // 需要留意：超支 5% 以上的類別、高風險劇目
  const alerts=[];
  P.forEach((p,i)=>{
    p.costs.forEach(c=>{if(c.actual!=null&&c.budget>0&&c.actual>c.budget*1.05)alerts.push({i,lv:'bad',t:`${p.name}：${short(c.label)}超支 ${plain(c.actual-c.budget)}`,s:`預算 ${plain(c.budget)} → 實際 ${plain(c.actual)}（+${pct(c.actual/c.budget-1)}）`,w:c.actual-c.budget});});
    if(/高/.test(p.risk))alerts.push({i,lv:'warn',t:`${p.name}：保本售票率 ${pct(p.breakevenRate)}`,s:'要賣超過八成票先回本',w:0});
  });
  alerts.sort((a,b)=>b.w-a.w);

  return `

      <button class="play" type="button" data-go="${i}">
        <div class="p-head"><div><div class="p-name">${esc(p.name)}</div><div class="p-meta">${p.shows} 場 · 滿座票房 <span class="n">${plain(p.fullGross)}</span></div></div><span class="pill ${riskClass(p.risk)}">${esc(p.risk||'—')}</span></div>
        <div class="duo">
          <div><div class="lbl">預算損益</div><div class="v n ${tone(p.budgetPnL)}">${money(p.budgetPnL)}</div></div>
          <div><div class="lbl">實際損益</div><div class="v n ${ap==null?'na':tone(ap)}">${ap==null?'未結算':money(ap)}</div></div>

      <div class="cols"><span></span><span>類別</span><span>預算</span><span>實際</span><span>差異</span></div>
      <div>${cats}</div>
      <div class="tot"><span></span><div class="c-name">總成本</div><div class="c-num n"><em>預算</em>${money(p.totalCost)}</div><div class="c-num n"><em>實際</em>${ac==null?'<span class="na">—</span>':money(ac)}</div><div class="c-num n"><em>差異</em>${diffCell(p.totalCost,ac,true)}</div></div>
    </div>
  </section>

  <section class="card panel">
    <h2>收入</h2>
    <div>
      <div class="inc-r h"><div>項目</div><div>預算</div><div>實際</div><div>差異</div></div>
      ${inc('門票收入（已扣手續費）',p.budgetTicket,p.actual.ticket)}
      ${inc('贊助／資助',p.sponsor,p.actual.sponsor)}
      ${inc('場刊及周邊',p.merch,p.actual.merch)}
      <div class="inc-r t"><div>最終損益</div><div class="c-num n ${tone(p.budgetPnL)}"><em>預算</em>${money(p.budgetPnL)}</div><div class="c-num n ${ap==null?'na':tone(ap)}"><em>實際</em>${ap==null?'—':money(ap)}</div><div class="c-num n"><em>差異</em>${ap==null?'<span class="na">—</span>':diffCell(p.budgetPnL,ap,false)}</div></div>
    </div>
    <div class="note">滿座票房 ${plain(p.fullGross)} · 手續費 ${pct(p.feePct)} · 滿座淨票房 ${plain(p.fullNet)} · 每場平均成本 ${plain(p.shows?p.totalCost/p.shows:null)}</div>
  </section>

  <section class="card panel">
    <h2>售票率試算</h2>
    <div class="scen"><span>如果售票率係 <b class="n" id="rateV"></b></span><span class="big n" id="scenV"></span>
      <input type="range" id="rate" min="0" max="100" value="${Math.round(p.budgetRate*100)}" aria-label="假設售票率"></div>
    <div class="note">損益 ＝ 售票率 × 滿座淨票房 ＋ 其他收入 − 總成本（同 Sheet「總覽」公式）· 保本線 ${pct(p.breakevenRate)}</div>
  </section>`;
}
function wireDetail(p){
  document.querySelectorAll('.cat-h').forEach(b=>b.addEventListener('click',()=>{const c=b.parentElement;const o=c.classList.toggle('open');b.setAttribute('aria-expanded',o);}));
  const r=document.getElementById('rate'),rv=document.getElementById('rateV'),sv=document.getElementById('scenV'),other=p.sponsor+p.merch;
  const upd=()=>{const v=r.value/100*p.fullNet+other-p.totalCost;rv.textContent=r.value+'%';sv.innerHTML=money(v);sv.className='big n '+tone(v);};
  r.addEventListener('input',upd);upd();
}

load();
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>

</body>
</html>
